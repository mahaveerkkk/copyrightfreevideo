version: '3.8'

services:
  # 1. Reverse Proxy & Rate Limiter
  nginx:
    image: nginx:alpine
    container_name: cr_shield_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

  # 2. Web API Gateway (FastAPI)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cr_shield_api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - shared_storage:/app/storage
    depends_on:
      - redis
    restart: always

  # 3. Redis Message Broker & State Store
  redis:
    image: redis:7-alpine
    container_name: cr_shield_redis
    ports:
      - "6379:6379"
    restart: always

  # 4. Distributed Celery Video Workers (Scale horizontally across CPU cores/servers)
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - shared_storage:/app/storage
    depends_on:
      - redis
    restart: always

  # 5. Garbage Collection Daemon (Prevents VPS disk exhaustion)
  cleaner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python core/cleaner_daemon.py
    volumes:
      - shared_storage:/app/storage
    restart: always

volumes:
  shared_storage:
